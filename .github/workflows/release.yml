name: Package Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Bundle Production Files
        shell: pwsh
        run: |
          # 1. Create clean release folder
          $releaseDir = "./release_staging/miraie-controller"
          New-Item -ItemType Directory -Path "$releaseDir/backend" -Force
          New-Item -ItemType Directory -Path "$releaseDir/frontend" -Force

          # 2. Copy ONLY runtime files
          Copy-Item -Path "./backend/*.py", "./backend/requirements.txt" -Destination "$releaseDir/backend"
          Copy-Item -Recurse -Path "./frontend/dist" -Destination "$releaseDir/frontend/dist"
          Copy-Item -Path "./tray_app.py", "./run_server.vbs", "./README.md" -Destination "$releaseDir/"

          # 3. Zip the clean directory
          Compress-Archive -Path "$releaseDir" -DestinationPath "./miraie-controller-windows.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./miraie-controller-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true