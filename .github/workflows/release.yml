name: Package Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Build Frontend
        shell: pwsh
        run: |
          cd frontend
          if (Test-Path package-lock.json) { npm ci } else { npm install }
          npm run build
          cd ..

      - name: Bundle Production Files
        shell: pwsh
        run: |
          $releaseDir = "./release_staging/miraie-controller"
          New-Item -ItemType Directory -Path "$releaseDir/backend" -Force | Out-Null
          New-Item -ItemType Directory -Path "$releaseDir/frontend/dist" -Force | Out-Null
          New-Item -ItemType Directory -Path "$releaseDir/assets" -Force | Out-Null

          # Copy Backend Python files & dependencies
          Copy-Item -Path "./backend/*.py" -Destination "$releaseDir/backend"
          Copy-Item -Path "./backend/requirements.txt" -Destination "$releaseDir/backend"

          # Copy compiled Frontend dist bundle
          Copy-Item -Recurse -Path "./frontend/dist/*" -Destination "$releaseDir/frontend/dist"

          # Copy Assets (including favicon/icon)
          if (Test-Path "./assets/favicon.png") {
              Copy-Item -Path "./assets/favicon.png" -Destination "$releaseDir/assets/"
              Copy-Item -Path "./assets/favicon.png" -Destination "$releaseDir/icon.png"
          }

          # Copy Root Launchers, Documentation & Batch Scripts (Safely)
          $rootFiles = @("tray_app.py", "run_miraie_controller.vbs", "README.md", "*.bat")
          foreach ($pattern in $rootFiles) {
              Get-Item -Path "./$pattern" -ErrorAction SilentlyContinue | Copy-Item -Destination "$releaseDir/"
          }

          # Compress to release ZIP (Preserves top-level folder)
          Compress-Archive -Path "$releaseDir" -DestinationPath "./miraie-controller-windows.zip" -Force

      # Upload as downloadable artifact (Useful for manual workflow_dispatch test runs)
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: miraie-controller-windows
          path: ./miraie-controller-windows.zip
          retention-days: 7

      # Create GitHub Release (Runs on tagged commits)
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./miraie-controller-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true