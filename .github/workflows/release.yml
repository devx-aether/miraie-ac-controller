name: Package Production Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        shell: pwsh
        run: |
          cd frontend
          npm install
          npm run build
          cd ..

      - name: Bundle Production Files
        shell: pwsh
        run: |
          $releaseDir = "./release_staging/miraie-controller"
          New-Item -ItemType Directory -Path "$releaseDir/backend" -Force | Out-Null
          New-Item -ItemType Directory -Path "$releaseDir/frontend" -Force | Out-Null

          # Copy backend files
          Copy-Item -Path "./backend/*.py" -Destination "$releaseDir/backend"
          Copy-Item -Path "./backend/requirements.txt" -Destination "$releaseDir/backend"

          # Copy compiled frontend dist bundle
          Copy-Item -Recurse -Path "./frontend/dist/*" -Destination "$releaseDir/frontend"

          # Copy explicit root launcher & helper files
          Copy-Item -Path "./tray_app.py" -Destination "$releaseDir/"
          Copy-Item -Path "./run_miraie_controller.vbs" -Destination "$releaseDir/"
          Copy-Item -Path "./README.md" -Destination "$releaseDir/"

          # Compress to release ZIP
          Compress-Archive -Path "$releaseDir" -DestinationPath "./miraie-controller-windows.zip" -Force

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./miraie-controller-windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true